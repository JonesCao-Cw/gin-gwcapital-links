<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线学习资源共享平台 | 2024班级主页</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #f5f7fa;
            color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            background: white;
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            max-width: 600px;
            width: 90%;
        }

        .icon-box {
            width: 80px;
            height: 80px;
            background: #e1f5fe;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            color: #039be5;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 24px;
            font-weight: 700;
            color: #333;
        }

        p {
            margin: 0 0 32px;
            color: #666;
            font-size: 15px;
            line-height: 1.6;
        }

        .btn-start {
            display: inline-block;
            padding: 16px 48px;
            background-color: #039be5; /* 沉稳的教育蓝 */
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(3, 155, 229, 0.3);
        }

        .btn-start:hover {
            background-color: #0288d1;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(3, 155, 229, 0.4);
        }

        .footer {
            margin-top: 40px;
            font-size: 12px;
            color: #999;
        }

        /* 装饰性的虚假列表 */
        .fake-list {
            text-align: left;
            margin-top: 30px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        .fake-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            font-size: 13px;
            color: #555;
        }
        .fake-icon {
            width: 8px; height: 8px;
            background: #ddd;
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon-box">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
            </svg>
        </div>

        <h1>2025年度 师生学习资料共享库</h1>
        <p>
            欢迎访问班级内部资源站。<br>
            请点击下方按钮进入系统，查阅最新教学课件与参考资料。
        </p>

        <a href="home.html" class="btn-start">
            进入学习系统
        </a>

        <div class="fake-list">
            <div class="fake-item"><div class="fake-icon"></div>近期更新：微积分基础课程.pdf</div>
            <div class="fake-item"><div class="fake-icon"></div>近期更新：英语四六级听力素材.zip</div>
            <div class="fake-item"><div class="fake-icon"></div>通知：本周五下午教研组会议纪要</div>
        </div>
    </div>

    <div class="footer">
        © 2025 Education Resources Platform. Internal Use Only.
    </div>

</body>
</html>
