<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全球态势感知 | GW Capital</title>
  <link rel="icon" href="images/logo.png" type="image/png">
  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
    iframe { border: none; width: 100%; height: 100%; display: block; position: relative; z-index: 2; }
    
    /* 加载提示层 */
    .loading-layer {
      position: absolute; inset: 0; 
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #0f172a; z-index: 1;
      color: #fff;
    }
    .spinner {
      width: 50px; height: 50px; 
      border: 4px solid rgba(34, 211, 238, 0.1); 
      border-top-color: #22d3ee; 
      border-radius: 50%; 
      animation: spin 1s linear infinite; 
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .warn-box {
      margin-top: 20px; padding: 10px 20px; 
      background: rgba(243, 186, 47, 0.15); 
      border: 1px solid rgba(243, 186, 47, 0.4); 
      border-radius: 8px; 
      color: #F3BA2F; font-size: 14px; font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="loading-layer">
    <div class="spinner"></div>
    <h2 style="margin:0; text-shadow: 0 0 20px rgba(34,211,238,0.5);">正在建立加密连接...</h2>
    <div class="warn-box">
      ⚠ 如长时间无法加载，请检查您的网络环境（梯子🪜）
    </div>
  </div>

  <iframe src="http://149.30.255.53:4173/" allowfullscreen></iframe>

</body>
</html>
